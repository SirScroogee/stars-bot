services:
  postgres:
    image: postgres:15
    container_name: stars_postgres
    restart: always
    environment:
      POSTGRES_DB: stars_bot
      POSTGRES_USER: stars_user
      POSTGRES_PASSWORD: stars_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stars_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
